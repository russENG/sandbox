[project]
name = "couple-calendar"
version = "0.1.0"
description = "夫婦で使うGoogle共有カレンダーを、Claude CodeとLINEのコンシェルジュから操作する"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.8,<3",
    "line-bot-sdk>=3.27,<4",
    "google-api-python-client>=2.200",
    "google-auth>=2.40",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "mcp>=2.3,<3",
    "python-dotenv>=1.0",
    "pillow>=11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
couple-calendar-mcp = "couple_calendar.mcp_server:main"
couple-calendar-sync = "couple_calendar.work_sync:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/couple_calendar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
