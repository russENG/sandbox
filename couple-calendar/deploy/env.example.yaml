# Cloud Run に渡す環境変数（秘密情報以外）。env.yaml にコピーして値を入れる:
#   cp deploy/env.example.yaml deploy/env.yaml
# 秘密情報（APIキー・LINEのシークレットとトークン）は Secret Manager から渡すので、ここには書かない。
GOOGLE_CALENDAR_ID: "xxxxxxxx@group.calendar.google.com"
TIMEZONE: "Asia/Tokyo"

MEMBER1_NAME: "たろう"
MEMBER1_COLOR: "9"
MEMBER1_EMAIL: ""
MEMBER1_LINE_USER_ID: ""
MEMBER1_PERSONAL_CALENDAR_ID: ""
MEMBER1_WORK_CALENDAR_ID: ""

MEMBER2_NAME: "はなこ"
MEMBER2_COLOR: "4"
MEMBER2_EMAIL: ""
MEMBER2_LINE_USER_ID: ""
MEMBER2_PERSONAL_CALENDAR_ID: ""
MEMBER2_WORK_CALENDAR_ID: ""

BOTH_LABEL: "ふたり"
BOTH_COLOR: "10"

CLAUDE_MODEL: "claude-opus-5-5"
CLAUDE_EFFORT: "medium"
LINE_SETUP_MODE: "true"   # 二人のLINEユーザーIDを設定し終えたら "false" にして再デプロイ
GROUP_TRIGGER_WORDS: "コンシェルジュ"
WORK_SYNC_DAYS: "56"      # 仕事のカレンダーの自動取り込みで、今日から何日先まで見るか
